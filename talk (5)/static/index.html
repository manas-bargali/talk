<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06080B">
<title>Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080B;--ice:#DDF4F1;--dim:#6C858B;--cy:#4FE3D6;--red:#FF3D57;--line:rgba(190,235,230,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ice);font:400 16px/1.55 "Chakra Petch",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
/* black-glass screen: scanlines, a diagonal reflection, dark vignette */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
 linear-gradient(115deg,transparent 38%,rgba(255,255,255,.04) 38.2%,transparent 52%),
 radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.7))}
.wrap{width:100%;max-width:520px;padding:0 20px}
.hud{padding-top:18px;display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.04em}
h1.glitch{animation:gl .5s steps(2) 1}
@keyframes gl{0%{text-shadow:2px 0 var(--red),-2px 0 var(--cy);transform:translateX(-2px)}50%{text-shadow:-3px 0 var(--red),3px 0 var(--cy);transform:translateX(2px)}100%{text-shadow:none;transform:none}}
.rank{color:var(--cy);font-weight:500}.rank b{margin-right:6px}
.xp{height:4px;background:#111A21}
.xp i{display:block;height:100%;width:0;background:var(--cy);box-shadow:0 0 10px var(--cy);transition:width .8s}
.hud small{color:var(--dim);font-size:13px}
main{display:flex;flex-direction:column;align-items:center;padding-bottom:40px}
.stage{position:relative;width:min(86vw,320px);aspect-ratio:1;margin-top:3vh}
#ring{position:absolute;inset:0;width:100%;height:100%}
#orb{position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;border:1px solid var(--line);cursor:pointer;color:var(--ice);display:grid;place-items:center;
 background:radial-gradient(circle at 30% 22%,#22323C 0,#0A1015 48%,#030507 100%);
 box-shadow:inset 0 0 0 6px #05080B,inset 0 0 28px rgba(79,227,214,.18),0 0 40px rgba(79,227,214,.12);transition:border-color .3s,color .3s,box-shadow .3s}
#orb::after{content:"";position:absolute;left:18%;top:9%;width:48%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);transform:rotate(-18deg);pointer-events:none}
#orb::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;pointer-events:none}
#orb:focus-visible{outline:2px solid var(--cy);outline-offset:8px}
#orb svg{width:44px;height:44px;position:relative;z-index:1}
#orb .stop{display:none}
[data-s=listening] #orb{border-color:var(--red);color:var(--red);box-shadow:inset 0 0 0 6px #05080B,inset 0 0 34px rgba(255,61,87,.35),0 0 50px rgba(255,61,87,.3)}
[data-s=listening] #orb .mic{display:none}
[data-s=listening] #orb .stop{display:block}
[data-s=thinking] #orb{cursor:progress}
[data-s=thinking] #orb::before{border-top-color:var(--cy);animation:spin 1s linear infinite}
[data-s=speaking] #orb{border-color:var(--cy)}
@keyframes spin{to{transform:rotate(360deg)}}
#status{margin:14px 0 0;min-height:1.6em;color:var(--dim);text-align:center}
[data-s=error] #status{color:var(--red)}
.panel{width:100%;margin-top:20px;padding:14px 16px;background:rgba(12,17,23,.85);border:1px solid var(--line);border-left:2px solid var(--cy)}
[data-s=error] .panel{border-left-color:var(--red)}
.panel small{color:var(--dim);font-size:13px}
.panel p{margin:0 0 10px;white-space:pre-wrap}
#you{color:var(--dim)}
#reply.typing::after{content:"\258D";color:var(--cy);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.energy{width:100%;margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px}
.e{flex:1;height:4px;background:#111A21}
.e i{display:block;height:100%;width:0;background:var(--cy);transition:width .6s}
.energy.low .e i{background:#C28F2C}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);z-index:10;padding:10px 16px;background:#0C1117;border:1px solid var(--cy);color:var(--ice);transition:transform .4s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.right{display:flex;align-items:center;gap:14px}
#snd{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--cy);cursor:pointer;padding:0}
#snd svg{width:18px;height:18px}
#snd .x{display:none}
#snd[aria-pressed=false]{color:var(--dim)}
#snd[aria-pressed=false] .w{display:none}
#snd[aria-pressed=false] .x{display:block}
#snd:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.hud{position:relative}
#cfg{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--cy);cursor:pointer;padding:0}
#cfg svg{width:18px;height:18px}
#cfg[aria-expanded=true]{border-color:var(--cy);background:rgba(79,227,214,.08)}
#cfg:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
#menu{position:absolute;right:20px;top:60px;z-index:8;width:min(330px,calc(100vw - 40px));padding:14px 16px;background:#0A0F14;border:1px solid var(--cy);box-shadow:0 12px 40px rgba(0,0,0,.6);display:grid;gap:12px}
#menu label{display:grid;gap:4px;color:var(--dim);font-size:13px}
#menu select{width:100%;padding:8px 10px;background:#0C1117;color:var(--ice);border:1px solid var(--line);font:inherit;font-size:15px}
#menu select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#menu .hint{margin:0;color:var(--dim);font-size:12px;line-height:1.45}
#meta{display:block;margin-top:-4px;color:var(--dim);font-size:12px}
#meta.fb{color:#C28F2C}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-s="idle">
<header class="wrap hud">
 <div class="row"><h1 id="title">Talk</h1>
  <div class="right">
   <button id="cfg" aria-expanded="false" aria-controls="menu" aria-label="Settings: model, language, voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
   </button>
   <button id="snd" aria-pressed="true" aria-label="Sound on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>
   </button>
   <div class="rank"><b id="lv">Lv 1</b><span id="rk">Observer</span></div>
  </div>
 </div>
 <div class="xp"><i id="xpbar"></i></div>
 <div class="row"><small id="xptxt">0 / 50 xp</small><small id="streak">streak 0 days</small></div>
 <div id="menu" role="group" aria-label="Settings" hidden>
  <label>Model <select id="selModel"><option value="auto">Auto (best available)</option></select></label>
  <label>I speak <select id="selLang"><option value="auto">Auto-detect</option></select></label>
  <label>Voice <select id="selVoice"><option value="auto">Auto (most natural available)</option><option value="device">This device's own voice</option></select></label>
  <p class="hint">If the model you pick is full for today, Talk quietly switches to the next one so you are never stuck. Choose Hindi under "I speak" for better Hindi recognition and a Hindi reply.</p>
 </div>
</header>
<main class="wrap">
 <div class="stage">
  <canvas id="ring"></canvas>
  <button id="orb" aria-label="Record or stop">
   <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
   <svg class="stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
 </div>
 <p id="status" role="status" aria-live="polite">Tap the orb, speak, then tap again to send</p>
 <section class="panel" id="log" hidden>
  <small>you</small><p id="you"></p>
  <small>talk</small><p id="reply"></p>
  <small id="meta"></small>
 </section>
 <div class="energy" id="energy" hidden><div class="e"><i id="ebar"></i></div><small id="etxt"></small></div>
</main>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s), MAX = 30, N = 72; // MAX = longest recording in seconds
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
let rec, chunks = [], stream, timer, history = [], actx, an, freq, sessionTalks = 0, typer, starting = false, cancelStart = false;
const glitch = () => { const t = $('#title'); t.classList.remove('glitch'); void t.offsetWidth; t.classList.add('glitch'); };
let pingT, slowT;
const LABEL = { idle: 'Start recording', listening: 'Stop and send', thinking: 'Working', speaking: 'Stop speaking', error: 'Start recording' };
const setS = (s, msg) => {
  document.body.dataset.s = s; if (msg) $('#status').textContent = msg;
  $('#orb').setAttribute('aria-label', LABEL[s]);
  clearInterval(pingT); clearTimeout(slowT);
  if (s === 'thinking') {
    let k = 0; sfx('ping'); pingT = setInterval(() => { if (++k < 5) sfx('ping'); }, 1100); // a few soft pings, then quiet
    slowT = setTimeout(() => { if (document.body.dataset.s === 'thinking') $('#status').textContent = 'Still working. Free models can be slow at busy times.'; }, 8000);
  }
  if (s === 'error') { glitch(); sfx('error'); }
};

/* ---------- sound: all synthesized in the browser (no files, works offline) ---------- */
let SA, master, soundOn = true, pend = null;
try { soundOn = localStorage.getItem('talk-sound') !== 'off'; } catch {}
function audioCtx() {
  if (!SA) {
    SA = new (window.AudioContext || window.webkitAudioContext)();
    master = SA.createGain(); master.gain.value = .5;
    const lp = SA.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200; // soften every sound
    master.connect(lp); lp.connect(SA.destination);
  }
  if (SA.state === 'suspended') SA.resume();
  return SA;
}
function tone(f, at, dur, o = {}) {
  const a = audioCtx(), osc = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .15, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + .05);
}
// notes come from one pentatonic scale, so any order sounds pleasant
const S = {
  tap:    () => tone(660, 0, .07, { type: 'triangle', vol: .1 }),
  start:  () => { tone(523.25, 0, .12, { vol: .2 }); tone(783.99, .07, .18, { vol: .2 }); },              // rising: channel open
  stop:   () => { tone(783.99, 0, .1, { vol: .18 }); tone(523.25, .07, .16, { vol: .18 }); },             // falling: sent
  ping:   () => tone(880, 0, .5, { vol: .045, to: 850 }),                                                 // quiet sonar while thinking
  reply:  () => { tone(659.25, 0, .18, { type: 'triangle', vol: .17 }); tone(880, .1, .3, { type: 'triangle', vol: .15 }); tone(1318.5, .1, .3, { vol: .04 }); },
  xp:     () => [1046.5, 1318.5, 1568].forEach((f, i) => tone(f, i * .06, .2, { type: 'triangle', vol: .09 })),
  level:  () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * .09, .35, { type: 'triangle', vol: .15 })),
  unlock: () => { tone(783.99, 0, .2, { vol: .14 }); tone(1174.7, .1, .4, { vol: .14 }); tone(1568, .2, .5, { vol: .09 }); },
  error:  () => tone(220, 0, .28, { vol: .17, to: 165 })                                                  // soft low thud, not a harsh buzz
};
const V = { start: 12, stop: 10, level: [15, 50, 15], unlock: [10, 40, 10] }; // tiny phone vibration
function sfx(n) {
  if (!soundOn) return;
  try { S[n](); if (V[n] && navigator.vibrate) navigator.vibrate(V[n]); } catch {}
}
const snd = $('#snd');
function paintSnd() { snd.setAttribute('aria-pressed', soundOn); snd.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off'); }
snd.onclick = () => {
  soundOn = !soundOn; paintSnd();
  try { localStorage.setItem('talk-sound', soundOn ? 'on' : 'off'); } catch {}
  sfx('tap');
};
paintSnd();

/* ---------- settings menu: model, spoken language, voice (remembered in this browser) ---------- */
const PREF = { model: 'auto', lang: 'auto', voice: 'auto' }, NAMES = { model: {}, voice: {} };
try { Object.assign(PREF, JSON.parse(localStorage.getItem('talk-prefs') || '{}')); } catch {}
const savePref = () => { try { localStorage.setItem('talk-prefs', JSON.stringify(PREF)); } catch {} };
const SEL = { model: $('#selModel'), lang: $('#selLang'), voice: $('#selVoice') };
function fill(sel, key, items) {
  if (!Array.isArray(items) || !items.length) return;
  sel.replaceChildren(...items.map(o => Object.assign(document.createElement('option'), { value: o.id, textContent: o.label })));
  if (NAMES[key]) items.forEach(o => { NAMES[key][o.id] = o.label; });
  if (![...sel.options].some(o => o.value === PREF[key])) PREF[key] = 'auto'; // a saved choice that no longer exists falls back to auto
  sel.value = PREF[key];
}
async function loadOptions() {
  try {
    const o = await (await fetch('/api/options')).json();
    fill(SEL.model, 'model', o.models); fill(SEL.lang, 'lang', o.languages); fill(SEL.voice, 'voice', o.voices);
  } catch { Object.keys(SEL).forEach(k => { SEL[k].value = PREF[k]; }); }
}
Object.keys(SEL).forEach(k => { SEL[k].onchange = () => { PREF[k] = SEL[k].value; savePref(); sfx('tap'); }; });
const cfg = $('#cfg'), menu = $('#menu');
function menuOpen(on) { menu.hidden = !on; cfg.setAttribute('aria-expanded', on); if (on) SEL.model.focus(); else if (document.activeElement && menu.contains(document.activeElement)) cfg.focus(); }
cfg.onclick = () => { sfx('tap'); menuOpen(menu.hidden); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) menuOpen(false); });
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && !cfg.contains(e.target)) menuOpen(false); });

/* ---------- game layer: xp, ranks, streak, unlocks (saved in this browser) ---------- */
const RANKS = ['Observer', 'Signal', 'Operator', 'Ghost', 'Architect', 'Oracle'];
const ACH = { first: 'First contact', five: 'Long haul: 5 talks in one visit', hindi: 'Polyglot: spoke Hindi', night: 'Night owl', streak3: 'Three days running' };
let G = { xp: 0, talks: 0, streak: 0, last: '', ach: [] }, queue = [];
try { Object.assign(G, JSON.parse(localStorage.getItem('talk-game') || '{}')); } catch {}
const saveG = () => { try { localStorage.setItem('talk-game', JSON.stringify(G)); } catch {} };
const lvl = () => Math.floor(G.xp / 50) + 1;
function hud() {
  $('#lv').textContent = 'Lv ' + lvl(); $('#rk').textContent = RANKS[Math.min(lvl() - 1, 5)];
  $('#xpbar').style.width = (G.xp % 50) * 2 + '%'; $('#xptxt').textContent = (G.xp % 50) + ' / 50 xp';
  $('#streak').textContent = 'streak ' + G.streak + (G.streak === 1 ? ' day' : ' days');
}
let running = false;
function toast(m, kind) { queue.push([m, kind]); }
function runToasts() { if (!running && queue.length) { running = true; nextToast(); } }
function nextToast() {
  const [m, kind] = queue[0], t = $('#toast'); t.textContent = m; t.classList.add('show'); sfx(kind);
  setTimeout(() => { t.classList.remove('show'); queue.shift(); if (queue.length) setTimeout(nextToast, 450); else running = false; }, 2600);
}
function award(text) {
  const before = lvl(), d = new Date().toLocaleDateString('en-CA'); // local date, so the streak follows YOUR midnight
  if (G.day !== d) { G.day = d; G.dayXp = 0; G.capNote = false; }
  if (G.last !== d) { const y = new Date(Date.now() - 864e5).toLocaleDateString('en-CA'); G.streak = G.last === y ? G.streak + 1 : 1; G.last = d; }
  if (text.trim().split(/\s+/).length < 3) { saveG(); return hud(); } // one-word taps earn nothing
  if (G.dayXp >= 100) {
    if (!G.capNote) { G.capNote = true; toast('Daily XP is full. Your streak still counts.', 'tap'); setTimeout(runToasts, 700); }
    saveG(); return hud();
  }
  G.xp += 10; G.dayXp += 10; G.talks++; sessionTalks++;
  const got = k => { if (!G.ach.includes(k)) { G.ach.push(k); toast('Unlocked: ' + ACH[k], 'unlock'); } };
  if (G.talks === 1) got('first'); if (sessionTalks === 5) got('five');
  if (/[\u0900-\u097F]/.test(text)) got('hindi'); if (new Date().getHours() < 5) got('night'); if (G.streak >= 3) got('streak3');
  if (lvl() > before) { toast('Level up: ' + RANKS[Math.min(lvl() - 1, 5)], 'level'); glitch(); }
  saveG(); hud(); sfx('xp'); setTimeout(runToasts, 700); // reward lands after the voice is done
}

/* ---------- energy: one friendly number for how much free capacity is left ---------- */
async function energy() {
  try {
    const s = await (await fetch('/api/status')).json(), e = $('#energy');
    e.hidden = false; $('#ebar').style.width = s.energy + '%'; e.classList.toggle('low', s.energy < 15);
    $('#etxt').textContent = !s.configured ? 'Server needs an API key' : s.energy < 15 ? 'Energy low: replies may pause' : 'Energy ' + s.energy + '%';
  } catch {}
}

/* ---------- recording ---------- */
$('#orb').onclick = () => {
  const s = document.body.dataset.s; audioCtx(); unlockVoice(); // first tap unlocks sound on phones
  if (starting) { cancelStart = true; return; }
  if (s === 'speaking') { stopVoice(); return done(); }
  if (s === 'thinking') return;
  if (s === 'listening') return stop();
  start();
};
async function start() {
  if (!navigator.mediaDevices || !window.MediaRecorder)
    return setS('error', window.isSecureContext ? 'This browser cannot record. Try Chrome, Edge, Firefox or Safari 14.3+.' : 'The microphone needs a secure page (https).');
  starting = true; cancelStart = false;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { starting = false; return setS('error', 'Microphone is blocked. Allow it in your browser settings.'); }
  if (cancelStart) { starting = false; stream.getTracks().forEach(t => t.stop()); return setS('idle', 'Cancelled. Tap the orb to talk.'); }
  setS('listening', 'Listening. Tap to send'); sfx('start');
  await new Promise(r => setTimeout(r, 200)); // let the chime end so the mic does not record it
  starting = false;
  if (cancelStart) { stream.getTracks().forEach(t => t.stop()); return setS('idle', 'Cancelled. Tap the orb to talk.'); }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); an = actx.createAnalyser(); an.fftSize = 256;
    actx.createMediaStreamSource(stream).connect(an); freq = new Uint8Array(an.frequencyBinCount); } catch { an = null; }
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data); rec.onstop = send; rec.start();
  timer = setTimeout(stop, MAX * 1000);
}
function stop() {
  if (!rec || rec.state !== 'recording') return;
  clearTimeout(timer); rec.stop(); stream.getTracks().forEach(t => t.stop());
  an = null; if (actx) { actx.close(); actx = null; }
  sfx('stop');
}
async function toWav(blob) { // any browser format -> 16 kHz mono WAV
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(await blob.arrayBuffer()); ac.close();
  const off = new OfflineAudioContext(1, Math.ceil(audio.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0), n = pcm.length * 2, v = new DataView(new ArrayBuffer(44 + n));
  let peak = 0; pcm.forEach(x => { peak = Math.max(peak, Math.abs(x)); });
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n, true);
  pcm.forEach((x, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x)) * 0x7fff, true));
  return { blob: new Blob([v], { type: 'audio/wav' }), peak, secs: audio.duration };
}
async function send() {
  setS('thinking', 'Decoding signal…');
  try {
    const fd = new FormData();
    const { blob, peak, secs } = await toWav(new Blob(chunks));
    if (secs < .6) return setS('idle', 'Too short. Speak a little longer, then tap to send.');
    if (peak < .02) return setS('error', 'I could not hear you. Check your microphone and try again.');
    fd.append('audio', blob, 'rec.wav'); fd.append('history', JSON.stringify(history));
    fd.append('model', PREF.model); fd.append('lang', PREF.lang); fd.append('voice', PREF.voice);
    const ctl = new AbortController(), kill = setTimeout(() => ctl.abort(), 60000);
    const res = await fetch('/api/talk', { method: 'POST', body: fd, signal: ctl.signal }); clearTimeout(kill);
    const j = await res.json().catch(() => ({}));
    if (j.transcript) { $('#log').hidden = false; $('#you').textContent = j.transcript; }
    if (!res.ok) { energy(); return setS('error', j.error || 'Something went wrong. Try again.'); }
    history = [...history, { role: 'user', content: j.transcript }, { role: 'assistant', content: j.reply }].slice(-6);
    clearInterval(pingT);
    sfx('reply'); typeIn(j.reply, 40); pend = j.transcript; energy(); showMeta(j);
    setTimeout(() => j.audio ? playVoice(j) : speak(j.reply), 380); // chime first, then the voice
  } catch (e) { setS('error', e.name === 'AbortError' ? 'This is taking too long. Try again in a moment.' : 'Could not reach the server. Check your connection.'); }
}
function typeIn(text, ms) {
  clearInterval(typer); const el = $('#reply'), a = Array.from(text); let i = 0;
  if (calm) { el.textContent = text; return; }
  el.textContent = ''; el.classList.add('typing');
  typer = setInterval(() => { el.textContent = a.slice(0, ++i).join(''); if (i >= a.length) { clearInterval(typer); el.classList.remove('typing'); } }, ms);
}
function showMeta(j) { // which model answered and which voice spoke; amber when the pick was full and a backup stepped in
  const m = $('#meta'), parts = [];
  if (j.provider_label) parts.push('Model: ' + j.provider_label);
  if (j.voice_label) parts.push('Voice: ' + j.voice_label);
  let note = '';
  if (j.fell_back) note = ' \u2022 ' + (NAMES.model[PREF.model] || 'Your pick') + ' is full right now, so a backup answered';
  else if (PREF.voice !== 'auto' && PREF.voice !== 'device' && j.voice && j.voice !== PREF.voice) note = ' \u2022 ' + (NAMES.voice[PREF.voice] || 'Your voice') + ' is unavailable, so a backup spoke';
  m.textContent = parts.join(' \u2022 ') + note; m.classList.toggle('fb', !!note);
}
/* server voice: one reusable <audio>, unlocked on the first tap so phones allow playback after the reply arrives */
const voiceEl = new Audio(); let voiceOk = false;
function unlockVoice() {
  if (voiceOk) return; voiceOk = true;
  try { voiceEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; voiceEl.play().catch(() => {}); } catch {}
}
function stopVoice() { try { speechSynthesis.cancel(); } catch {} voiceEl.onended = voiceEl.onerror = null; voiceEl.pause(); }
function playVoice(j) {
  setS('speaking', 'Speaking. Tap to stop');
  const back = () => { voiceEl.onended = voiceEl.onerror = null; speak(j.reply); }; // server voice failed: use the device voice instead
  voiceEl.onended = () => done(); voiceEl.onerror = back;
  voiceEl.src = 'data:' + j.audio_type + ';base64,' + j.audio;
  voiceEl.play().catch(back);
}
function pickVoice(lang) { // best installed device voice for this language: natural/neural/Google/Microsoft beat the plain robotic ones
  const want = lang.toLowerCase().replace('_', '-'), norm = v => v.lang.toLowerCase().replace('_', '-');
  const score = v => { const n = v.name.toLowerCase();
    return (norm(v) === want ? 4 : 0) + (/natural|neural|online/.test(n) ? 6 : 0) + (/google|microsoft|siri|enhanced|premium/.test(n) ? 3 : 0) + (v.localService ? 0 : 1) - (/espeak/.test(n) ? 5 : 0); };
  return speechSynthesis.getVoices().filter(v => norm(v).startsWith(want.slice(0, 2))).sort((a, b) => score(b) - score(a))[0];
}
function speak(t) {
  setS('speaking', 'Speaking. Tap to stop');
  if (!window.speechSynthesis) return done('This browser cannot speak, so the reply is text only.');
  const u = new SpeechSynthesisUtterance(t), hi = /[\u0900-\u097F]/.test(t);
  u.lang = hi ? 'hi-IN' : (navigator.language || 'en-US');
  const v = pickVoice(u.lang);
  if (v) { u.voice = v; u.lang = v.lang; }
  if (hi) u.rate = .95; // a touch slower is clearer for Hindi on most device voices
  if (hi && speechSynthesis.getVoices().length && !v) return done('No Hindi voice on this device, so this reply is text only. Pick a server voice in settings for Hindi speech.');
  u.onend = u.onerror = () => done(); speechSynthesis.speak(u);
}
function done(msg) { // voice finished or stopped: go idle, then give the XP reward
  if (document.body.dataset.s !== 'speaking') return;
  setS('idle', msg || 'Tap the orb to talk again');
  if (pend) { const p = pend; pend = null; award(p); }
}

/* ---------- the ring: reacts to your voice, then to the reply ---------- */
const cv = $('#ring'), cx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
cv.width = cv.height = 320 * dpr; cx.scale(dpr, dpr);
let lastDraw = 0;
function draw(t) {
  const s = document.body.dataset.s, live = s === 'listening' && an;
  if (s === 'idle' && t - lastDraw < 66) return requestAnimationFrame(draw); // idle: ~15 fps saves battery
  lastDraw = t;
  cx.clearRect(0, 0, 320, 320);
  if (live) an.getByteFrequencyData(freq);
  cx.strokeStyle = s === 'listening' ? '#FF3D57' : s === 'thinking' ? '#DDF4F1' : '#4FE3D6';
  cx.globalAlpha = s === 'idle' ? .45 : .95; cx.lineCap = 'round'; cx.lineWidth = 3;
  for (let i = 0; i < N; i++) {
    let v;
    if (live) v = freq[Math.floor(i / N * freq.length * .7)] / 255;
    else if (calm) v = .08;
    else if (s === 'speaking') v = .2 + .5 * Math.abs(Math.sin(t / 240 + i * .45) * Math.sin(t / 870 + i * .2));
    else if (s === 'thinking') v = (((i - Math.floor(t / 45)) % N + N) % N) < 9 ? .55 : .08;
    else v = .07 + .04 * Math.sin(t / 800 + i * .6);
    const a = i / N * Math.PI * 2 - Math.PI / 2, r0 = 104, r1 = r0 + 4 + v * 46;
    cx.beginPath(); cx.moveTo(160 + Math.cos(a) * r0, 160 + Math.sin(a) * r0); cx.lineTo(160 + Math.cos(a) * r1, 160 + Math.sin(a) * r1); cx.stroke();
  }
  requestAnimationFrame(draw);
}
hud(); energy(); loadOptions(); glitch(); requestAnimationFrame(draw);
