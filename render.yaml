# Render Blueprint: New + > Blueprint in the Render dashboard, pick your GitHub repo, then paste your keys when asked.
services:
  - type: web
    name: talk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # one worker on purpose: the usage counters live in this one process. Render provides $PORT.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    envVars:
      - key: TRUST_PROXY        # Render sits behind a proxy; this makes per-visitor limits use the real visitor IP
        value: "1"
      # Secrets: Render asks for these on first deploy. Leave any you do not have empty.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
